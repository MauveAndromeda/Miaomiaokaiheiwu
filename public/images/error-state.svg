<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="error-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1F1F;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#1A0F0F;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="error-cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#C44569"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="url(#error-bg)"/>
  <!-- Cute cat face -->
  <ellipse cx="100" cy="110" rx="40" ry="35" fill="url(#error-cat)"/>
  <!-- Ears -->
  <path d="M65 85L55 55L80 75Z" fill="url(#error-cat)"/>
  <path d="M135 85L145 55L120 75Z" fill="url(#error-cat)"/>
  <path d="M68 82L60 60L78 76Z" fill="#FFB6C1"/>
  <path d="M132 82L140 60L122 76Z" fill="#FFB6C1"/>
  <!-- Sad eyes (X shape) -->
  <path d="M80 100L90 110M80 110L90 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 100L120 110M110 110L120 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="4" ry="3" fill="#FFB6C1"/>
  <!-- Sad mouth -->
  <path d="M90 130C90 130 95 125 100 125C105 125 110 130 110 130" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Whiskers (droopy) -->
  <line x1="58" y1="118" x2="75" y2="115" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="56" y1="128" x2="75" y2="124" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="142" y1="118" x2="125" y2="115" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="144" y1="128" x2="125" y2="124" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <!-- Tear drop -->
  <ellipse cx="75" cy="118" rx="4" ry="6" fill="#60A5FA" opacity="0.7"/>
  <!-- Warning icon -->
  <circle cx="155" cy="55" r="18" fill="#EF4444" opacity="0.9"/>
  <text x="155" y="62" fill="#FFFFFF" font-size="24" font-weight="bold" text-anchor="middle">!</text>
</svg>
