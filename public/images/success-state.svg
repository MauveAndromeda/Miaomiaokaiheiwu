<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="success-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2D1F;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0F1A0F;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="success-cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#C44569"/>
    </linearGradient>
  </defs>
  <!-- Sparkles -->
  <circle cx="45" cy="50" r="3" fill="#FFD700"/>
  <circle cx="160" cy="45" r="2" fill="#FFD700"/>
  <circle cx="35" cy="140" r="2" fill="#FFD700"/>
  <circle cx="170" cy="130" r="3" fill="#FFD700"/>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="url(#success-bg)"/>
  <!-- Cute cat face -->
  <ellipse cx="100" cy="110" rx="40" ry="35" fill="url(#success-cat)"/>
  <!-- Ears -->
  <path d="M65 85L55 55L80 75Z" fill="url(#success-cat)"/>
  <path d="M135 85L145 55L120 75Z" fill="url(#success-cat)"/>
  <path d="M68 82L60 60L78 76Z" fill="#FFB6C1"/>
  <path d="M132 82L140 60L122 76Z" fill="#FFB6C1"/>
  <!-- Happy eyes (^_^) -->
  <path d="M78 105C78 105 85 98 92 105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M108 105C108 105 115 98 122 105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Blush -->
  <ellipse cx="72" cy="115" rx="6" ry="4" fill="#FF9999" opacity="0.5"/>
  <ellipse cx="128" cy="115" rx="6" ry="4" fill="#FF9999" opacity="0.5"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="4" ry="3" fill="#FFB6C1"/>
  <!-- Happy mouth (big smile) -->
  <path d="M88 125C88 125 94 135 100 135C106 135 112 125 112 125" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Whiskers -->
  <line x1="58" y1="112" x2="75" y2="115" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="58" y1="122" x2="75" y2="122" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="142" y1="112" x2="125" y2="115" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="142" y1="122" x2="125" y2="122" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <!-- Success check -->
  <circle cx="155" cy="55" r="18" fill="#10B981" opacity="0.9"/>
  <path d="M147 55L153 61L165 49" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Party effects -->
  <path d="M50 65L55 60L52 70Z" fill="#A78BFA" opacity="0.7"/>
  <path d="M155 150L160 145L157 155Z" fill="#F472B6" opacity="0.7"/>
</svg>
