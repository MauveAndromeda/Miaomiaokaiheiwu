<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="30%" style="stop-color:#3B82F6"/>
      <stop offset="70%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="diamond-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <filter id="diamond-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="32,4 56,24 32,60 8,24" fill="url(#diamond-grad)" filter="url(#diamond-glow)"/>
  <polygon points="32,4 44,24 32,44 20,24" fill="url(#diamond-shine)" opacity="0.4"/>
  <line x1="8" y1="24" x2="56" y2="24" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="4" x2="20" y2="24" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
  <line x1="32" y1="4" x2="44" y2="24" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
</svg>
