name: Build APK

on:
  push:
    branches: [ main, master, 'claude/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK: 'true'
          NEXT_PUBLIC_ENV: 'development'

      - name: Fix asset paths for file:// protocol
        run: node scripts/fix-paths.js

      - name: Verify Next.js build output
        run: |
          echo "=== Checking out/ directory ==="
          if [ -d "out" ]; then
            echo "out/ directory exists"
            ls -la out/
            echo "=== Checking for index.html ==="
            if [ -f "out/index.html" ]; then
              echo "index.html found!"
              echo "=== Verifying paths are relative ==="
              if grep -q '"/_next/' out/index.html; then
                echo "ERROR: Absolute paths still present!"
                head -30 out/index.html
                exit 1
              else
                echo "SUCCESS: All paths are relative"
                head -20 out/index.html
              fi
            else
              echo "ERROR: index.html not found in out/"
              find out -name "*.html" | head -10
              exit 1
            fi
          else
            echo "ERROR: out/ directory does not exist!"
            ls -la
            exit 1
          fi

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -r out/* android/app/src/main/assets/www/
          echo "=== Assets copied to www directory ==="
          ls -la android/app/src/main/assets/www/
          echo "=== Verifying index.html in assets ==="
          head -5 android/app/src/main/assets/www/index.html || echo "index.html not found!"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --warning-mode all

      - name: List APK outputs
        run: |
          echo "APK outputs:"
          find android/app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
